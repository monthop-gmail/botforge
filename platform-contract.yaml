# ─────────────────────────────────────────────────────────────────────────────
# Consumer manifest — ประกาศว่า repo นี้ยึด contract อะไรของ agent-platform
#
# รูปแบบตาม ADR-0006 ของ agent-platform:
#   https://github.com/monthop-gmail/agent-platform/blob/main/decisions/0006-contract-versioning.md
# commit ของ contract ที่ pin ไว้ และรายการ schema ที่ vendor:
#   conformance/pinned.yaml
#
# ⚠️ ไฟล์นี้อยู่บน branch `v2` ไม่ใช่ `main`
#    `main` คือ Botforge V1 ที่ freeze ไว้ที่ tag `v1-final` — bot 14 ตัวที่ deploy อยู่
#    ยึด commit นั้นเป็นฐาน และ main รับเฉพาะ security/credential fix ไม่รับ feature
#    งาน V2 ทั้งหมดรวมทั้ง conformance อยู่บน `v2`
#    manifest จะย้ายไป main เมื่อ v2 กลายเป็นสายหลัก
#
# ที่มาของการตัดสินใจ: docs/architecture/contract-mapping.md
# ─────────────────────────────────────────────────────────────────────────────


platform_contract_version: "0.1"

# ประกาศเฉพาะที่ "ใช้จริงและมี payload ให้ตรวจ" — ไม่ประกาศล่วงหน้า
contracts:
  - error/v1        # getErrorHint() เดิมมี taxonomy 5 แบบที่ map เข้า Category ได้เกือบครบ
                    # (rate_limited · timeout · authentication/authorization · provider_error)
                    # ยกเว้น "context ยาวเกิน" ที่ยังไม่มี category ตรง — ใช้ validation
                    # + code: runtime.context_exhausted ไปก่อน · ดู contract-mapping.md §4.1
                    #
                    # ⚠️ message ห้ามมี credential/PII/prompt — ของเดิมใน opencode ส่ง
                    #    error ดิบจาก provider ให้ผู้ใช้เห็น ต้องตรวจก่อนประกาศข้อนี้

  - event/v1        # Botforge ยังไม่ผลิต event เลย แต่นี่เป็นทางเดียวที่ payload_check
                    # จะมีของจริงให้ตรวจ · เป็นผู้ผลิต event ไม่ใช่ผู้บริโภค
                    # แบบเดียวกับ ecosystem-intelligence (agent-platform#40)
                    #
                    # 🔒 guarantee ที่ต้องบังคับเอง JSON Schema ตรวจให้ไม่ได้:
                    #    · append-only
                    #    · no silent state change — ของเดิม sessions.delete() เกิด 3-4 จุด
                    #      ต่อไฟล์โดยไม่มีบันทึก ต้องปิดช่องนี้ก่อน
                    #    · ห้ามสร้าง job_id ปลอม — Botforge ไม่มี job ก็ไม่ต้องใส่
                    #    · ห้ามเก็บ chain-of-thought เป็น audit record

# contract ที่ยังไม่ได้ใช้ — จะเพิ่มเมื่อ implement จริง ไม่ประกาศล่วงหน้า
not_yet:
  - identity/v1     # ✅ blocker ทั้งสองข้อตัดสินแล้ว 2026-08-23 และ implement แล้วที่
                    #    packages/core/src/identity.ts (10 test ผ่าน)
                    #      1. id ของ channel = {channel}-{lowercase(rawId)}
                    #         LINE id ขึ้นต้นด้วย U/C/R ตัวใหญ่ ผิด ID_PATTERN ทุกตัว
                    #      2. tenant = ลูกค้า · workspace = bot หนึ่งตัว
                    #         legal มี 5 bot · cowork มี 2 bot
                    #         ห้าม derive จากชื่อ project (vithisa-49m · legal-services)
                    #         ประกาศผ่าน BOTFORGE_TENANT_ID / BOTFORGE_WORKSPACE_ID
                    #
                    #    ยังอยู่ใน not_yet เพราะ payload_check ยังตรวจแค่ error/v1
                    #    identity จะมี payload ให้ตรวจเมื่อ core ปล่อย event/v1

  - execution/v1    # session ของ Botforge เป็น Map entry ไม่มี state machine
                    # transition ของ contract บังคับ pending -> authorizing เท่านั้น
                    # แต่ Botforge ไม่มี policy layer จึงไม่มี authorizing ให้ผ่าน

  - provider/v1     # agent-provider เข้ากับ RuntimeAdapter ดีที่สุดในทั้งหมด
                    # (schema ระบุชื่อ OpenCode, Claude Code, Codex CLI, Copilot CLI ตรง ๆ)
                    # แต่ยังไม่มี RuntimeAdapter จริง — รอ Phase 1.5/3
                    # หมายเหตุที่พร้อมประกาศแล้ว: is_native=false, session.resumable=false,
                    # observability_depth=turn ทั้ง 9 · cancellation ไม่เท่ากัน:
                    # gocode เป็น kill_only (DELETE session) ที่เหลือ graceful

  - model/v1        # Usage.cost_usd ชื่อตรงกับของเดิมเป๊ะ แต่มีแค่ 2 ใน 9 engine
                    # (claude-code, copilot-cli) รอ core รวม cost tracking ให้ครบก่อน

  - tool/v1         # ไม่มีของเดิม — Botforge ไม่ได้ประกาศ tool เอง runtime จัดการ
  - mcp/v1          # ไม่มีของเดิมเลย ไม่มีไฟล์ .mcp.json ในrepo สักไฟล์
                    # (feature-matrix.md §11) · auth.credential_ref ต้องมี secret store ก่อน
                    # ของเดิม mount ~/.claude ~/.config/gh ~/.config/gcloud เข้า container ตรง ๆ
  - agent/v1        # workspace มีแค่ AGENTS.md + README.md ยังไม่เป็น agent definition
  - profile/v1      # ยังห่างจาก AGENTS.md มาก

  - policy/v1       # Botforge ไม่ตัดสิน policy เอง
  - capability/v1   # ยังไม่มี capability routing
  - approval/v1     # ไม่มี approval flow
  - consent/v1      # ไม่ได้จัดการ PII ที่ต้องขอความยินยอม
  - artifact/v1     # ไม่ผลิต artifact

# ─────────────────────────────────────────────────────────────────────────────
# leaf ที่อาจถือข้อความของคน — RFC-0013 · event/v1 semantics 1.5 (agent-platform#71, #72)
#
# pin ปัจจุบันอยู่ที่ semantics 1.5 (event/v1 v1.8.1) — ขยับจาก 1.3 ที่ไล่ leaf ไว้ครั้งแรก
# v1.8.1 เพิ่ม platform_rules ข้อ "การประกาศแบบ wildcard กลืน ratchet ของตัวเอง ห้ามใช้"
# ซึ่ง agent-platform เขียนจากข้อที่ repo นี้จับได้ตอนร่าง (agent-platform#83)
# เราทำตามอยู่แล้วตั้งแต่ใบแรก — ประกาศ 4 leaf เป็นชื่อจริงทั้งหมด ไม่มี wildcard
# และปิด metadata ด้วยทะเบียนคีย์ใน payload_check
# 1.4 และ 1.5 ไม่เพิ่มงานไล่ leaf ให้ repo นี้ เพราะทั้งสองข้อผูกกับ approval/v1
# ซึ่งเราไม่ได้ pin (ยืนยันที่ dis-b492ed20 seq 7 และตรวจกับ schema ที่ vendor แล้ว)
# ส่วน platform_rules สองข้อใหม่ของ v1.8.0 (event.schema.yaml บรรทัด 264-269)
# บังคับสิ่งที่ payload_check ทำอยู่แล้ว:
#   · การประกาศต้องเป็นสิ่งที่ตัวตรวจอ่านจริง  → อ่านจากใบนี้โดยตรง ไม่ถือสำเนา
#   · metadata ไม่ได้ถูกยกเว้นเพราะสัญญาไม่ได้ตั้งชื่อคีย์ → ปิดด้วยทะเบียน key ไม่ใช้ wildcard
#
# ไล่จาก payload จริงที่ conformance/emit_payloads.ts ปล่อยออกมา ไม่ได้ไล่จาก schema
#   error/v1 16 ใบ · channel-event/v1 17 ใบ
#   ก่อนตัด actor.display_name: leaf 35 ตัว · หลังตัด: 34 (error 4 · event 30)
#   ตัวชี้ 30 · ประกาศเป็นข้อความ 4
#
# ⚠️ payload_check.py อ่านบล็อกนี้โดยตรง ไม่ถือรายการของตัวเอง
#    leaf ที่ไม่อยู่ในทะเบียนตัวชี้ของ checker และไม่ได้ประกาศที่นี่ = แดง
#    (ทดสอบสองทางใน selftest ของ payload_check — ถอด path ออกจากที่นี่แล้วต้องแดง)
# ─────────────────────────────────────────────────────────────────────────────
text_fields:
  - path: $.transition.reason
    contract: channel-event/v1
    event_types: [STATE_TRANSITION]
    written_by: system
    detail: >-
      วันนี้เป็นข้อความคงที่ที่โค้ดเขียนเอง — `รอคิวของ session` (queued) และ
      `ผู้ใช้สั่ง /abort` (cancelled ค่า default) · แต่ไม่ใช่ชุดปิด:
      cancelled(ctx, reason) และ emitter.transition(extra.reason) รับ string อะไรก็ได้
      ประกาศเพราะ seam เปิด ไม่ใช่เพราะค่าที่ปล่อยอยู่วันนี้ — ตัวตรวจบอกได้ว่า leaf ไหน
      ไม่ใช่ตัวชี้ แต่บอกไม่ได้ว่าใครพิมพ์ค่า
    retention_layer: ดู cutover.retention_layer

  - path: $.metadata.reason
    contract: channel-event/v1
    event_types: [SESSION_CLOSED]
    written_by: system
    detail: >-
      เหตุผลที่ session ถูกปิด · sessionClosed(ctx, reason) เป็นพารามิเตอร์เปิดและ
      ไม่มีค่า default ต่างจาก cancelled() — เป็น seam ที่เปิดกว้างที่สุดในสองตัวนี้
      · เป็น key เดียวใน metadata ที่ประกาศเป็นข้อความ ที่เหลือเป็นทะเบียนตัวชี้ปิด
    retention_layer: ดู cutover.retention_layer

  - path: $.error.message
    contract: channel-event/v1
    event_types: [EXECUTION_FAILED]
    written_by: system
    detail: >-
      ข้อความดิบจาก provider · เราไม่ได้แต่งประโยคเองและคุมเนื้อในไม่ได้ —
      provider บางเจ้าสะท้อนเนื้อหา prompt กลับมาในข้อความ error
      · payload_check บังคับอยู่แล้วว่าห้ามมี credential และตัดที่ 200 ตัวอักษร
    retention_layer: ดู cutover.retention_layer

  - path: $.message
    contract: error/v1
    written_by: system
    detail: >-
      leaf เดียวกันในคนละบริบท — getErrorHint() ส่งต่อข้อความของ provider ตรง ๆ
      16 ใบที่ตรวจทุกรอบเป็นข้อความของเครื่องทั้งหมด ประกาศเพราะต้นทางเป็นข้อความ
      ที่เราไม่ได้เขียน
    retention_layer: >-
      ใบ error/v1 แบบยืนเดี่ยวไม่ได้ถูกบันทึกเป็น audit — ส่งกลับให้ผู้ใช้เห็นทาง LINE
      แล้วจบ ไม่มี store ฝั่งเรา

# จุด cutover — RFC-0013 บังคับให้ประกาศว่า "ตั้งแต่เมื่อไหร่" และ "ของเก่าค้างอะไร"
cutover:
  since: v2 — PR ที่ใส่บล็อกนี้
  outstanding: >-
    ไม่มี — ยังไม่เคยมี audit event ของ V2 ถูกเขียนในของจริงเลยสักใบ
    หลักฐาน: apps/line-bot เป็นที่เดียวที่ผูก EventSink และไม่มี container ของมันรันอยู่
    · ทั้ง 16 project ใน projects/ ไม่มีตัวไหนใช้ @botforge/core — ทุกตัวเป็น V1
    (main @ v1-final) ซึ่งไม่ปล่อย event อะไรเลย
    · ต่างจาก care-agent-platform ที่ actor.display_name ค้างอยู่ในใบเก่าทุกใบตั้งแต่
    ใบแรกของระบบและลบไม่ได้ — เราจึงตัดสินใจข้อนี้ได้ก่อนจ่ายราคา ซึ่งเป็นสิ่งที่
    RFC-0013 บอกเองว่าข้อจำกัดแบบนี้ต้องมาก่อนมี production data ไม่ใช่หลัง
  retention_layer: >-
    sink ของ V2 คือ console.log(JSON.stringify(event)) → stdout ของ container
    → docker log driver json-file ของโฮสต์
    · ลบราย field ไม่ได้ (append-only ตาม frozen guarantee ของ event/v1)
    · ลบได้ทางเดียวคือลบ container ทิ้งทั้งตัว
    · ⚠️ ยังไม่มี log rotation — ไม่มีบล็อก logging: ใน apps/line-bot/docker-compose.yml
    และโฮสต์ไม่มี /etc/docker/daemon.json · ต้องตั้งเพดานก่อน V2 ขึ้นของจริง
    ไม่ใช่เพราะ RFC สั่ง แต่เพราะข้อ 3 ของ invariant ถามว่ากฎการเก็บอยู่ชั้นไหน
    และ "ไม่มีกฎ" ไม่ใช่คำตอบ
  closed_by_checker: >-
    สามข้อนี้ปิดด้วยโค้ดใน payload_check.py ไม่ใช่ด้วยคำแถลงในไฟล์นี้ —
    (1) actor.display_name ห้ามมีในใบไหนเลย (ชื่อคนจากโปรไฟล์ LINE · ตัดที่ emit แล้ว)
    (2) metadata เป็นทะเบียน key ปิด — key นอกทะเบียนแดงทันที แม้ event/v1 จะนิยาม
        metadata เป็น open bag
    (3) error.details ต้องว่างหรือมีแต่ตัวชี้ — วันนี้ไม่เคยใส่เลยสักใบ ปิดไว้ก่อน
        มีคนใส่ครั้งแรก

conformance:
  # ครบทั้ง 3 ข้อของ ADR-0006 — 2026-08-23
  #   1. manifest       ไฟล์นี้
  #   2. payload จริง    conformance/payload_check.py รัน core จริงแล้ว validate ผลลัพธ์
  #   3. release gate   ruleset "V1 freeze — main" บังคับ PR + สอง check นี้ ไม่มี bypass
  status: passing
  last_verified: "2026-09-22"

  # ขอบเขตของ gate — คุมทั้งสอง branch
  #
  #   main  สายที่ freeze ไว้ที่ tag v1-final — bot 14 ตัวที่ deploy อยู่ยึด commit นั้น
  #   v2    สายที่ขยับจริง manifest และ conformance อยู่ที่นี่
  #
  #   ⚠️ เดิมคุมแค่ main ซึ่งผิด — ADR-0006 ข้อ 3 บังคับ release gate ไม่ใช่แค่ "CI ที่รัน"
  #      gate ที่คุม branch ที่ freeze ไว้ ไม่ได้กันอะไรเลยบน branch ที่งานเดินอยู่
  #      แก้ตามที่ agent-platform#43 ทักมา
  release_gate:
    bypass_actors: 0
    required_checks:
      - "packages — test + typecheck"
      - "conformance — ADR-0006"
    rulesets:
      - name: "V1 freeze — main"
        branch: main
        rules: [deletion, non_fast_forward, pull_request, required_status_checks]
      - name: "V2 release gate — v2"
        branch: v2
        rules: [non_fast_forward, pull_request, required_status_checks]

  checks:
    - name: drift_check
      command: python3 conformance/drift_check.py
      status: passing
      scope: >-
        schema ที่ vendor ไว้ 8 ไฟล์ยังตรงกับ agent-platform ที่ commit ที่ pin
        บน CI ไม่มี local checkout จึงดึงจาก GitHub raw ที่ commit นั้นจริง
        4 ไฟล์ท้ายไม่ได้ประกาศใน contracts: แต่ต้อง vendor เพราะ event/v1 $ref ไปหา

    - name: payload_check
      command: python3 conformance/payload_check.py
      status: passing
      scope: >-
        error/v1 — 16 payload จริงจาก classify() ครอบคลุม 8 category
        (rate_limited · timeout · authentication · provider_error · validation
        · budget_exceeded · conflict · internal)
        channel-event/v1 (allOf event/v1) — 17 event จริงจาก scenario LINE webhook เต็มรอบ
        ทั้งหมดมาจาก @botforge/core จริง ไม่มี fixture ที่เขียนขึ้นเพื่อให้ผ่าน
        + ตรวจ guarantee ที่ JSON Schema ตรวจไม่ได้ — ห้าม credential · ห้าม reply_token
        · ห้าม chain-of-thought · ห้าม job_id ปลอม · sequence เพิ่มขึ้นเสมอต่อ subject
        + สำมะโน leaf ตาม RFC-0013 — เดิน leaf ทุกตัวของทั้งสองสัญญา (34 leaf ต่างกัน)
        แล้วบังคับว่าต้องเป็นตัวชี้ที่ขึ้นทะเบียนไว้ หรือถูกประกาศใน text_fields ของใบนี้
        · อ่านการประกาศจาก platform-contract.yaml โดยตรง ไม่ถือสำเนา
        · selftest สองทาง 6 เคส กลายพันธุ์จาก payload จริง — ชื่อคนกลับเข้ามา ·
        key ใหม่ใน metadata · error.details มีของ · leaf ใหม่ใน error/v1 ·
        ถอดการประกาศออกจากใบแล้วต้องแดง · ของจริงที่ไม่ได้แตะต้องเงียบ

    - name: core_test
      command: npm test --workspaces
      status: passing
      scope: >-
        149 test (core 111 + adapter-opencode 38) รวม characterization test
        ที่ยืนยันว่าโค้ดที่ยกมาจาก V1 ให้ผลตรงกับต้นฉบับ verbatim ทุกตัวอักษร
        (getErrorHint · chunkText · getTimeContext · extractResponse · stripStrayToolCalls)


# ส่วนขยายที่ Botforge นิยามเองในโดเมนของตัวเอง — ไม่ได้ขอให้ platform รับไปดูแล
#
# ChannelContract ตกเกณฑ์รับ contract ใหม่ของ agent-platform ข้อ 2 (ต้องมี consumer 2 ราย)
# และข้อ 4 (platform ต้องเข้าใจ semantics) — ซึ่งข้อ 4 ตรงกับที่ architecture doc ของ V2
# เขียนไว้เองว่า "Agent Platform ไม่ควรรู้รายละเอียดของ LINE Bot"
# จึงทำเป็น extension แบบเดียวกับ care-event/v1 ของ care-agent-platform
extensions:
  - id: channel-event/v1
    path: contracts/event/v1/channel-event.schema.yaml    # ยังไม่ได้เขียน
    extends: event/v1
    detail: >-
      เพิ่ม channel_type (line · telegram · web · discord) · channel_id · message_id
      · reply_token — additive ตาม RFC-0009 ไม่ลดทอน guarantee ข้อใดของ event/v1
      รองรับ event ที่ไม่มีใน vocabulary กลาง: CHANNEL_JOINED · CHANNEL_LEFT
      · MESSAGE_SKIPPED (กรณี [SKIP] ในกลุ่ม)
